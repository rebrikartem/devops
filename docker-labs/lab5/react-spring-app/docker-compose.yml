version: '3.9'

services:
  backend_db:
    image: mysql:8
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal

  backend:
    build:
      context: ./spring-backend/
      dockerfile: Dockerfile
      target: production
    container_name: backend
    restart: always
    depends_on:
      backend_db:
        condition: service_started
    environment:
      JDBC_URL: jdbc:mysql://backend_db:3306/hobbie_db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_PORT: ${MYSQL_PORT}
      DB_HOST: ${DB_HOST}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    expose:
      - ${BACKEND_PORT}
    networks:
      - internal

  frontend:
    build:
      context: ./react-frontend/
      dockerfile: Dockerfile
      target: production
      args:
        REACT_APP_API_HOST: http://localhost:${BACKEND_PORT}
    container_name: frontend
    restart: always
    depends_on:
      backend:
        condition: service_started
    environment:
      - FRONT_PORT=${FRONT_PORT}
    expose:
      - ${FRONT_PORT}
    networks:
      - internal

  proxy:
    container_name: nginx_proxy
    restart: always
    ports:
      - "${BACKEND_PORT}:${NGINX_PORT}"
    image: nginx:mainline
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      frontend:
        condition: service_started
    networks:
      - internal

volumes:
  mysql_data:

networks:
  internal: